              - generic [ref=e889]:
                - paragraph [ref=e890]: Olá! A diferença fundamental entre citação direta e citação indireta reside na forma como você incorpora o texto de outro autor em seu próprio trabalho, e isso está intimamente ligado às regras de formatação e à correta atribuição de autoria nas normas acadêmicas (como a ABNT).
                - paragraph [ref=e891]:
                  - text: Em resumo, a distinção se baseia na
                  - strong [ref=e892]: forma
                  - text: "como você reproduz a informação original:"
                - heading "1. Citação Direta" [level=3] [ref=e894]:
                  - text: 1. Citação Direta
                  - generic [ref=e895]:
                    - link "Link to heading":
                      - /url: "#1-citacao-direta"
                - paragraph [ref=e896]:
                  - text: A citação direta é a transcrição
                  - strong [ref=e897]: exata
                  - text: de um trecho do texto original do autor. Você copia literalmente as palavras que deseja incluir no seu trabalho.
                - list [ref=e898]:
                  - listitem [ref=e899]:
                    - strong [ref=e900]: "Como fazer:"
                    - text: Você deve usar aspas duplas (" ") para indicar o trecho copiado.
                  - listitem [ref=e901]:
                    - strong [ref=e902]: "Características:"
                    - text: É a reprodução literal da fonte.
                  - listitem [ref=e903]:
                    - strong [ref=e904]: "Quando usar:"
                    - text: Quando a formulação exata do autor é crucial para sua argumentação ou análise (por exemplo, ao citar uma definição específica, uma frase polêmica ou um dado exato).
                  - listitem [ref=e905]:
                    - strong [ref=e906]: "Regra Importante:"
                    - text: Sempre que for utilizar citação direta, é obrigatório indicar a fonte completa (autor, ano e o número da página) de onde o trecho foi retirado.
                - heading "2. Citação Indireta" [level=3] [ref=e908]:
                  - text: 2. Citação Indireta
                  - generic [ref=e909]:
                    - link "Link to heading":
                      - /url: "#2-citacao-indireta"
                - paragraph [ref=e910]: A citação indireta é a reprodução das ideias ou conceitos do autor com suas próprias palavras. Você parafraseia o conteúdo original para integrá-lo ao seu texto.
                - list [ref=e911]:
                  - listitem [ref=e912]:
                    - strong [ref=e913]: "Como fazer:"
                    - text: Você reescreve a ideia do autor, utilizando sua própria linguagem e estrutura frasal.
                  - listitem [ref=e914]:
                    - strong [ref=e915]: "Características:"
                    - text: É uma paráfrase da ideia.
                  - listitem [ref=e916]:
                    - strong [ref=e917]: "Quando usar:"
                    - text: Na maioria das vezes, é preferível utilizar a citação indireta, pois demonstra que você compreendeu o material lido e permite que você desenvolva a ideia com sua voz acadêmica.
                  - listitem [ref=e918]:
                    - strong [ref=e919]: "Regra Importante:"
                    - text: Mesmo sendo uma reformulação, a ideia central ainda pertence ao autor original. Portanto, é
                    - strong [ref=e920]: obrigatório
