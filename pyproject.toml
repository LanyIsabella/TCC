[project]
name = "tcc-sistema"
version = "0.1.0"
description = "Projeto experimental do TCC"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "docling>=2.126.0",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.136.0",
    "langchain>=1.2.15",
    "langchain-ollama>=1.1.0",
    "pyyaml>=6.0.3",
    "psycopg[binary]>=3.2.9",
    "pypdf>=5.9.0",
    "pymupdf>=1.24.0",
    "requests>=2.32.5",
    "rich>=14.2.0",
    "pillow>=12.0.0",
    "glmocr[selfhosted]>=0.1.5",
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "playwright>=1.52.0",
    "ruff",
]

[tool.pytest.ini_options]
markers = [
    "gedweb_playwright: teste de integração do acesso ao GEDWeb via Playwright",
]

[tool.ruff]
line-length = 88
src = ["src"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"
skip-magic-trailing-comma = false
