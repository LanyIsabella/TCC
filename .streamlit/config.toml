[theme]
base = "light"
font = "sans serif"
codeFont = "monospace"
primaryColor = "#1F6F8B"
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#EDF3F7"
textColor = "#19324D"
borderColor = "#D4E0E8"
linkColor = "#1F6F8B"
showWidgetBorder = true
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
showSidebarBorder = true
linkUnderline = false

# -------- Tema claro --------
[theme.light]
primaryColor = "#1F6F8B"
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#EDF3F7"
textColor = "#19324D"
borderColor = "#D4E0E8"

linkColor = "#1F6F8B"
codeTextColor = "#19324D"
codeBackgroundColor = "#EDF3F7"

dataframeBorderColor = "#D4E0E8"
dataframeHeaderBackgroundColor = "#DDECF0"
dataframeHeaderTextColor = "#19324D"

# opcionais, mas ajudam a manter a identidade visual
redColor = "#B94B5A"
orangeColor = "#B86B35"
yellowColor = "#A47E16"
greenColor = "#2D7A5B"
blueColor = "#1F6F8B"
violetColor = "#6D5B9B"
grayColor = "#65788A"

[theme.light.sidebar]
primaryColor = "#1F6F8B"
backgroundColor = "#EAF2F5"
secondaryBackgroundColor = "#DDECF0"
textColor = "#19324D"
borderColor = "#C9D9E2"

linkColor = "#1F6F8B"
codeTextColor = "#19324D"
codeBackgroundColor = "#F7F9FC"

dataframeBorderColor = "#C9D9E2"
dataframeHeaderBackgroundColor = "#DDECF0"
dataframeHeaderTextColor = "#19324D"

# -------- Tema escuro --------
[theme.dark]
primaryColor = "#1F7A8C"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#17243A"
textColor = "#E7F0F5"
borderColor = "#33465C"

linkColor = "#8FDDE4"
codeTextColor = "#E7F0F5"
codeBackgroundColor = "#17243A"

dataframeBorderColor = "#33465C"
dataframeHeaderBackgroundColor = "#20344F"
dataframeHeaderTextColor = "#E7F0F5"

# opcionais, mas ajudam a manter a identidade visual
redColor = "#F08A96"
orangeColor = "#E7A46E"
yellowColor = "#E5C86F"
greenColor = "#75C9A6"
blueColor = "#8FDDE4"
violetColor = "#B6A4F4"
grayColor = "#AFC0D0"

[theme.dark.sidebar]
primaryColor = "#1F7A8C"
backgroundColor = "#17243A"
secondaryBackgroundColor = "#20344F"
textColor = "#E7F0F5"
borderColor = "#33465C"

linkColor = "#8FDDE4"
codeTextColor = "#E7F0F5"
